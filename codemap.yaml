windows_and_permissions:
  capabilities:
    audience:
      file: crates/app/capabilities/audience.json
      permissions: ["core:event:allow-listen", "core:event:allow-unlisten"]
      windows: [stage, "stage-*"]
    operator:
      file: crates/app/capabilities/operator.json
      permissions: ["core:default"]
      windows: [main]
    statistics:
      file: crates/app/capabilities/statistics.json
      permissions: ["core:event:allow-listen", "core:event:allow-unlisten"]
      windows: [stats]
  windows:
    main: studio/index.html
    stage: stage/index.html
    "stage-N (mirror)": "stage/index.html?mirror"
    stats: "studio/index.html?stats"
config:
  files:
    crates/app/tauri.beta.conf.json:
      bundle.icon:
        - icons/beta/32x32.png
        - icons/beta/128x128.png
        - "icons/beta/128x128@2x.png"
        - icons/beta/icon.icns
        - icons/beta/icon.ico
      identifier: org.questiongame.beta
      productName: "questiongame Beta"
    crates/app/tauri.conf.json:
      "$schema": "https://schema.tauri.app/config/2"
      app.security.csp: "default-src 'self'; img-src 'self' asset... #28d5e5c4"
      app.windows: []
      build.beforeBuildCommand: "npm run build && npm run release:check"
      build.beforeDevCommand: "npm run dev:webviews"
      build.devUrl: "http://localhost:5181"
      build.frontendDist: "../../dist"
      bundle.active: true
      bundle.category: Education
      bundle.copyright: "© 2026 aAndy03 and the questiongame contributors — GPL-3.0-or-later"
      bundle.icon: [icons/32x32.png, icons/128x128.png, "icons/128x128@2x.png", icons/icon.icns, icons/icon.ico]
      bundle.licenseFile: "../../LICENSE"
      bundle.longDescription: "questiongame runs a quiz show from one c... #bd1ade72"
      bundle.publisher: aAndy03
      bundle.shortDescription: "An offline quiz show: an operator studio and a fullscreen audience stage."
      bundle.targets: [nsis]
      bundle.windows.nsis.installMode: currentUser
      identifier: org.questiongame.desktop
      productName: questiongame
      version: "1.0.2"
    crates/app/tauri.dev.conf.json:
      identifier: org.questiongame.app
    crates/app/tauri.e2e.conf.json:
      identifier: org.questiongame.e2e
    crates/app/tauri.macos.conf.json:
      bundle.macOS.minimumSystemVersion: "13.0"
      bundle.macOS.signingIdentity: "-"
      bundle.targets: [app, dmg]
  identity_consts:
    BETA_IDENTIFIER: org.questiongame.beta
    DEV_IDENTIFIER: org.questiongame.app
    E2E_CHANNEL_ENV: QUESTIONGAME_E2E_CHANNEL
    E2E_IDENTIFIER: org.questiongame.e2e
    E2E_STABLE_DIR_ENV: QUESTIONGAME_E2E_STABLE_DIR
    RELEASE_IDENTIFIER: org.questiongame.desktop
build:
  cargo_members: [crates/app, crates/host, tools/codemap]
  crates:
    codemap:
      dependencies:
        proc-macro2: "1"
        quote: "1"
        serde: "workspace = 1; features [derive]"
        serde_json: "workspace = 1"
        syn: "2; features [full, visit, extra-traits]"
        toml: "1"
      features: {}
      path: tools/codemap
    questiongame-app:
      dependencies:
        "[cfg(windows)] windows": "0.61; features [Win32_Foundation, Win32_Devices_Display, Win32_Graphics_Gdi]"
        fs4: "workspace = 1.1; features [sync]; no default features"
        questiongame-host: "path ../host"
        rfd: "workspace = 0.17"
        rustls: "workspace = 0.23; features [ring, std, tls12]; no default features"
        rustls-native-certs: "workspace = 0.8"
        semver: "workspace = 1"
        serde: "workspace = 1; features [derive]"
        serde_json: "workspace = 1"
        sysinfo: "workspace = 0.39; features [system]; no default features"
        tauri: "workspace = 2"
        "tauri-build (build)": "workspace = 2"
        tauri-plugin-single-instance: "workspace = 2"
        thiserror: "workspace = 2"
