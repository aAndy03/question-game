        recipe_questions:
          - "recipe_id TEXT NOT NULL REFERENCES recipes(id) ON DELETE CASCADE"
          - "domain_id TEXT NOT NULL"
          - "question_id TEXT NOT NULL REFERENCES questions(id)"
          - "position INTEGER NOT NULL"
        recipe_teams:
          - "recipe_id TEXT NOT NULL REFERENCES recipes(id) ON DELETE CASCADE"
          - "team_id TEXT NOT NULL REFERENCES teams(id)"
          - "position INTEGER NOT NULL"
        recipes:
          - "id TEXT PRIMARY KEY"
          - "name TEXT NOT NULL"
          - "folder TEXT"
          - "tags_json TEXT NOT NULL DEFAULT '[]'"
          - "settings_json TEXT NOT NULL"
          - "layout_json TEXT NOT NULL DEFAULT '{}'"
          - "rev INTEGER NOT NULL DEFAULT 1"
          - "created_at INTEGER NOT NULL"
          - "updated_at INTEGER NOT NULL"
          - "archived_at INTEGER"
        teams:
          - "id TEXT PRIMARY KEY"
          - "name TEXT NOT NULL"
          - "short_code TEXT NOT NULL"
          - "color TEXT NOT NULL"
          - "logo_asset_id TEXT REFERENCES assets(id)"
          - "notes TEXT"
          - "created_at INTEGER NOT NULL"
          - "updated_at INTEGER NOT NULL"
          - "archived_at INTEGER"
          - "play_count INTEGER NOT NULL DEFAULT 0"
          - "last_play_at INTEGER"
      indexes:
        - "domain_questions_by_question ON domain_questions(question_id)"
        - "plays_by_recipe ON plays(recipe_id)"
        - "recipe_domains_by_domain ON recipe_domains(domain_id)"
        - "recipe_questions_by_question ON recipe_questions(question_id)"
        - "recipe_teams_by_team ON recipe_teams(team_id)"
      other: []
    "002":
      adds:
        - "domains: origin TEXT NOT NULL DEFAULT 'operator'"
        - "questions: origin TEXT NOT NULL DEFAULT 'operator'"
        - "recipes: origin TEXT NOT NULL DEFAULT 'operator'"
        - "teams: origin TEXT NOT NULL DEFAULT 'operator'"
      creates: {}
      indexes: []
      other: []
    "003":
      adds: ["plays: operator_id TEXT"]
      creates: {}
      indexes: ["plays_by_operator ON plays(operator_id)"]
      other: []
