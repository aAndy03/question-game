    ".github/workflows/release.yml":
      build:
        name: "Build (${{ matrix.name }})"
        needs: [test, e2e]
        runs: ["npm ci"]
        runs_on: "${{ matrix.os }}"
      e2e:
        name: "End-to-end (Windows)"
        needs: []
        runs: ["npm ci", "npm run e2e:build", "npm run e2e"]
        runs_on: windows-2022
      test:
        name: Test
        needs: []
        runs:
          - "npm ci"
          - "npm run release:route"
          - "npm run typecheck"
          - "npm run lint"
          - "npm test"
          - "npm run test:host"
          - "npm run test:app"
          - "npm run lint:app"
          - "npm run test:tools"
          - "npm run lint:tools"
          - "npm run map:check"
        runs_on: windows-latest
e2e:
  seeds:
    beta-copy.e2e.ts: "null"
    beta-corrupt.e2e.ts: "null"
    beta-no-stable.e2e.ts: "null"
    beta-stable-running.e2e.ts: "null"
    beta-start-empty.e2e.ts: "null"
    first-run.e2e.ts: "null"
    library-views.e2e.ts: "['--more-questions', '120']"
    load-refusal.e2e.ts: "['--broken-board']"
    show.e2e.ts: "[]"
    upgrade.e2e.ts: "[]"
  specs:
    e2e/specs/beta-copy.e2e.ts: ["questiongame Beta copies the stable library > copies it, opens on it, and leaves the original untouched"]
    e2e/specs/beta-corrupt.e2e.ts: ["questiongame Beta with an unreadable stable library > says the copy failed and still starts empty"]
    e2e/specs/beta-no-stable.e2e.ts: ["questiongame Beta without a stable library > offers only Start empty"]
    e2e/specs/beta-stable-running.e2e.ts: ["questiongame Beta while questiongame is running > asks to close it first, then copies"]
    e2e/specs/beta-start-empty.e2e.ts: ["questiongame Beta, started empty > goes to first run"]
    e2e/specs/first-run.e2e.ts: ["first run > sets up an operator and the Demo"]
    e2e/specs/library-views.e2e.ts: ["library views > pages, filters, groups and keeps the operator in place"]
    e2e/specs/load-refusal.e2e.ts: ["a refused Load > says why from the Roster and leads to the Board"]
    e2e/specs/show.e2e.ts: ["a show > loads a game, opens Stage, and puts the first question on air"]
    e2e/specs/upgrade.e2e.ts: ["an update > backs the library up, keeps it, and shows what is new"]
