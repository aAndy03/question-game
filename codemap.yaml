events:
  anim-complete:
    emitted_by: [anim_complete]
    in_contract: true
    payload: ["serde_json::json!"]
    stage_receives: false
    targets: [main]
  catalog-changed:
    emitted_by: [catalog_changed]
    in_contract: true
    payload: [CatalogChange]
    stage_receives: false
    targets: [main, stats]
  close-requested:
    emitted_by: [close_requested]
    in_contract: true
    payload: ["()"]
    stage_receives: false
    targets: [main]
  health:
    emitted_by: [health]
    in_contract: true
    payload: ["questiongame_host::HealthReport"]
    stage_receives: false
    targets: [main]
  monitors-changed:
    emitted_by: [monitors_changed]
    in_contract: true
    payload: [MonitorsChanged]
    stage_receives: false
    targets: [main]
  notice:
    emitted_by: [notice]
    in_contract: true
    payload: [Notice]
    stage_receives: false
    targets: [main]
  play-state:
    emitted_by: [play_state]
    in_contract: true
    payload: ["main_state()", "stage_state()"]
    stage_receives: true
    targets: [main, "stage*", stats]
  play-tick:
    emitted_by: [play_tick]
    in_contract: true
    payload: ["questiongame_host::stage::tick()"]
    stage_receives: true
    targets: [main, "stage*", stats]
  recipe-changed:
    emitted_by: [recipe_changed]
    in_contract: true
    payload: [RecipeChange]
    stage_receives: false
    targets: [main, stats]
contract:
  command_groups:
    app:
      - app_quit
      - app_close_cancelled
      - app_uninstall
      - app_info
      - update_check
      - update_open_release
      - whats_new_get
      - whats_new_seen
      - beta_welcome_get
      - beta_welcome_done
      - beta_copy_stable_library
    catalog:
      - catalog_list
      - catalog_get
      - catalog_upsert
      - catalog_upsert_many
      - catalog_archive
      - catalog_archive_many
      - catalog_restore
      - catalog_restore_many
      - catalog_import_questions
      - catalog_search
      - referenced_by
      - asset_put
      - recipe_list
      - recipe_get
      - recipe_upsert
      - recipe_new
      - recipe_archive
      - recipe_restore
      - recipe_duplicate
      - recipe_set_membership
      - recipe_set_settings
      - recipe_set_layout
      - recipe_set_overlay
      - catalog_seed_demo
      - catalog_seed_status
      - catalog_rebuild_search
      - wipe_plays
    flags:
      - settings_get
      - settings_set_global
      - settings_set_current_game
      - settings_set_shortcut
      - rules_preview
      - operator_set_pin
      - operator_activate
      - paths_get
      - paths_reveal
      - uninstall_data
      - health_get
      - client_log
      - perf_report
    match:
      - play_load
      - play_unload
      - play_start
      - pause
      - resume
      - restart
      - abandon
      - get_state
      - choose_domain
      - set_selection
      - lock_selection
      - start_timer
      - pause_timer
      - reveal_outcome
