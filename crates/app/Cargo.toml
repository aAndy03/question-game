[package]
name = "questiongame-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The binary is `questiongame`; the library is what the tests link against, so
# everything worth testing lives above `main.rs` rather than inside it.
[lib]
name = "questiongame_app"
path = "src/lib.rs"

[[bin]]
name = "questiongame"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
questiongame-host = { path = "../host" }
tauri = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
fs4 = { workspace = true }

# The memory line (`memory.rs`): the working set of this process and its
# WebView2 children, sampled into the log. Already in the tree through Tauri;
# named here so the four features it needs are declared by the crate that
# calls them. Windows only — elsewhere the line says "unavailable".
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
