[package]
name = "questiongame-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The binary is `questiongame`; the library is what the tests link against, so
# everything worth testing lives above `main.rs` rather than inside it.
[lib]
name = "questiongame_app"
path = "src/lib.rs"

[[bin]]
name = "questiongame"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
questiongame-host = { path = "../host" }
tauri = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
fs4 = { workspace = true }
sysinfo = { workspace = true }
rfd = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `QueryDisplayConfig`: the display topology Tauri's `available_monitors` does
# not see — EDID names, Duplicate groups, and connected panels Windows is not
# using (`monitors::topology`).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Gdi"] }
