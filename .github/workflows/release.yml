# Builds the installers and publishes them as a GitHub Release (P12.3, P13.0).
#
# Push a tag named after the version to release it:
#
#   git tag v1.1.0 && git push origin v1.1.0               questiongame
#   git tag v2.0.0-beta.1 && git push origin v2.0.0-beta.1 questiongame Beta, a pre-release
#
# The tag must match the version in Cargo.toml, crates/app/tauri.conf.json and
# package.json (crates/app/tests/bundle.rs holds those three together);
# scripts/lib/release-route.ts decides the route and refuses anything else.
# The release gets the Windows installer, the macOS disk image, and GitHub's
# own source-code archives. "Run workflow" on the Actions tab builds either
# channel without releasing it; the installers are attached to the run.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Which app to build
        type: choice
        options:
          - stable
          - beta
        default: stable

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: windows-latest
    outputs:
      channel: ${{ steps.route.outputs.channel }}
      publish: ${{ steps.route.outputs.publish }}
      prerelease: ${{ steps.route.outputs.prerelease }}
      config_args: ${{ steps.route.outputs.config_args }}
      release_name: ${{ steps.route.outputs.release_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: npm ci
      # Which app this run builds, and whether it publishes; a tag that is
      # neither vX.Y.Z nor vX.Y.Z-beta.N, or names another version, stops here.
      - name: Route
        id: route
        run: npm run release:route
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:host
      - run: npm run test:app
      - run: npm run lint:app
      - run: npm run test:tools
      - run: npm run lint:tools
      - name: codemap.yaml is current
        run: npm run map:check

  # The real app, driven through WebDriver (P12.14). Windows only: there is no
  # WebDriver for macOS's WKWebView. It drives the e2e build, whose identity
  # (org.questiongame.e2e) has a data folder of its own.
  e2e:
    name: End-to-end (Windows)
    # windows-2022, not windows-latest: on the windows-2025 image WebView2 ignores
    # the debugging port msedgedriver passes it, so no session ever starts
    # (actions/runner-images#14738). If 2022 is retired, attach instead: the app
    # opens its own port and msedgedriver connects via debuggerAddress.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - run: npm ci
      - name: tauri-driver and the WebView2 driver
        shell: bash
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          cd "$HOME/.cargo/bin" && ./msedgedriver-tool.exe
      - run: npm run e2e:build
      - name: Run the suite
        run: npm run e2e
        env:
          E2E_SKIP_BUILD: '1'
      # A session that never starts leaves no screenshot; the app's own log
      # says whether it booted, refused, or panicked.
      - name: Collect the e2e app's logs
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e/.artifacts | Out-Null
          Copy-Item "$env:APPDATA\org.questiongame.e2e\questiongame.log" e2e/.artifacts -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA\org.questiongame.e2e\perf" e2e/.artifacts -Recurse -ErrorAction SilentlyContinue
      - name: Keep what a failed step looked like
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: e2e/.artifacts/
          include-hidden-files: true

  build:
    name: Build (${{ matrix.name }})
    needs: [test, e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: npm ci

      # Tagged: build and attach to the release named after the tag. The
      # route says which app; the two steps differ only in what they tell people.
      - name: Build and publish (questiongame)
        if: needs.test.outputs.publish == 'true' && needs.test.outputs.channel == 'stable'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ needs.test.outputs.release_name }}
          releaseDraft: false
          prerelease: ${{ needs.test.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }} ${{ needs.test.outputs.config_args }}
          releaseBody: |
            ## Download

            - **Windows 10 / 11:** `questiongame_…_x64-setup.exe`
            - **macOS 13 or later (Apple Silicon and Intel):** `questiongame_…_universal.dmg`

            ### Updating from an earlier version

            **Install over the version you have — do not uninstall first.** Run the new installer (Windows) or drag the new app over the old one in Applications (macOS). Your teams, questions and games stay where they are, and questiongame copies them to a backup before it changes anything. Uninstalling first risks ticking *Delete the application data*, which removes your library. The first time it opens, questiongame shows what's new.

            ### These installers are not signed

            questiongame is a free, open-source project and does not pay for code-signing certificates, so your computer will warn you the first time.

            - **Windows:** a blue *"Windows protected your PC"* screen appears. Click **More info**, then **Run anyway**.
            - **macOS:** open the `.dmg` and drag questiongame to Applications. The first time you open it, macOS says it cannot verify the developer. Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to questiongame.

            See the [README](https://github.com/${{ github.repository }}#readme) for the full install guide.

      - name: Build and publish (questiongame Beta)
        if: needs.test.outputs.publish == 'true' && needs.test.outputs.channel == 'beta'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ needs.test.outputs.release_name }}
          releaseDraft: false
          prerelease: ${{ needs.test.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }} ${{ needs.test.outputs.config_args }}
          releaseBody: |
            **This is a beta.** questiongame Beta installs beside questiongame and keeps its own library; nothing you do in it changes your stable library. The first time it opens, it offers to copy your stable library or start empty.

            ## Download

            - **Windows 10 / 11:** `questiongame Beta_…_x64-setup.exe`
            - **macOS 13 or later (Apple Silicon and Intel):** `questiongame Beta_…_universal.dmg`

            ### Updating from an earlier version

            **Install over the version you have — do not uninstall first.** Run the new installer (Windows) or drag the new app over the old one in Applications (macOS). Your teams, questions and games stay where they are, and questiongame Beta copies them to a backup before it changes anything. Uninstalling first risks ticking *Delete the application data*, which removes your library. The first time it opens, questiongame Beta shows what's new.

            ### These installers are not signed

            questiongame is a free, open-source project and does not pay for code-signing certificates, so your computer will warn you the first time.

            - **Windows:** a blue *"Windows protected your PC"* screen appears. Click **More info**, then **Run anyway**.
            - **macOS:** open the `.dmg` and drag questiongame Beta to Applications. The first time you open it, macOS says it cannot verify the developer. Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to questiongame Beta.

            See the [README](https://github.com/${{ github.repository }}#readme) for the full install guide.

      # Manual run: build only, and keep the installers on the run.
      - name: Build
        if: needs.test.outputs.publish != 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }} ${{ needs.test.outputs.config_args }}
      - name: Keep the installers
        if: needs.test.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: questiongame-${{ needs.test.outputs.channel }}-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
