# Cargo workspace for the Rust host.
#
# `crates/host` is a plain library and stays one: a test sweeps its whole `src`
# tree for `tauri` and fails on a hit (04_ROADMAP.md). P6 wraps it from the
# outside instead — `crates/app` is the only member that knows Tauri exists, and
# it depends on `questiongame-host`, never the other way round.
[workspace]
resolver = "3"
members = ["crates/host", "crates/app", "tools/codemap"]

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["aAndy03 <https://github.com/aAndy03>"]
repository = "https://github.com/aAndy03/question-game"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1"
# P5. `bundled` compiles SQLite from source: no system library on either OS,
# which is what offline-first and a clean install require (04_ROADMAP.md).
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
# P6. The host has emitted `tracing` spans since P5 with nobody listening;
# this is the subscriber, and it lives in the app crate because a library must
# not choose a global one for its embedder.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# P5. Search is `catalog_search` on `CatalogService`, not a `SearchService`:
# one adapter exists and no second is planned (2.13), so a port would be
# indirection rather than a seam.
tantivy = "0.27"
# P6. Only `crates/app` may name these.
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
# P6. Installed now and not at P5 because nothing was asynchronous then: Tauri's
# async commands are what finally await. `rt-multi-thread` moves every command
# that touches the database off the main thread; `time` drives the 100ms tick.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
# P10. Operator pins are hashed in the host and never in the webview (§2.15).
# argon2id with a random salt, stored as a PHC string. 0.6's default
# `getrandom` feature is what salts it from the OS RNG.
argon2 = "0.6"
# P10. Free space on the user-data volume, for `health.disk_low`. Only the app
# crate names it: the host takes the number as an input (§12.6).
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
# P11.5. The per-second performance log (`crates/app/src/perf`): CPU and
# memory of the host process and every WebView2 child, from one crate on both
# platforms. Replaced the hand-rolled Win32 sampler of P11.4.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# P12.1. A release build has no console, so a boot failure needs a window of
# its own to be seen at all. The crate tauri-plugin-dialog is built on; used
# directly because the message is shown before Tauri's event loop exists.
rfd = "0.17"
# P12.2. A second launch focuses the running Studio instead of dying on the
# library lock with nowhere to say so. Keyed on the identifier, so dev and the
# installed app each have their own.
tauri-plugin-single-instance = "2"
# P12.9. "Is there a newer release?" — one GET to the GitHub API per launch,
# from the app crate only (the webview fetches nothing, `release:check`).
# rustls with ring, trusting the roots the OS trusts (`rustls-native-certs`),
# so a corporate proxy the machine already trusts works. Not `native-tls`,
# `platform-verifier` or the default roots: each pulls a CDLA-licensed root
# list the licence audit refuses.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider"] }
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"

# P12.2. The release build is what the operator runs on show day.
[profile.release]
lto = "thin"
codegen-units = 1
# panic stays "unwind" (the default): one panicking command must fail that
# command, not end the show. `boot::install_panic_hook` logs it.
